<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NMT Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0d11;
      --card-bg: #15181e;
      --card-hover: #1c2029;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --muted: #8b92a0;
      
      --c-hist: #f59e0b;
      --c-math: #3b82f6;
      --c-lang: #10b981;
      --c-lit: #ec4899;
      
      --radius-l: 22px;
      --radius-m: 14px;
      --radius-s: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 0;
      overflow-x: hidden;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg);
    }

    /* Верхний бар */
    header {
      padding: 24px 20px 16px;
      position: sticky;
      top: 0;
      background: rgba(12, 13, 17, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .overall-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    .overall-stats span {
      color: #fff;
      font-weight: 700;
    }

    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill-total {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Экран карточек (Главная) */
    #home-view {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .grid-hub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .subject-btn {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-l);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .subject-btn:active {
      transform: scale(0.96);
      background: var(--card-hover);
    }

    .btn-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-icon {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-m);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 700;
    }

    .percent-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .btn-bottom {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .subject-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
      color: #fff;
    }

    .subject-fraction {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .mini-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 2px;
    }

    .mini-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* Стили для каждого предмета */
    .theme-hist .badge-icon { background: rgba(245, 158, 11, 0.15); color: var(--c-hist); }
    .theme-hist .mini-fill { background: var(--c-hist); }

    .theme-math .badge-icon { background: rgba(59, 130, 246, 0.15); color: var(--c-math); }
    .theme-math .mini-fill { background: var(--c-math); }

    .theme-lang .badge-icon { background: rgba(16, 185, 129, 0.15); color: var(--c-lang); }
    .theme-lang .mini-fill { background: var(--c-lang); }

    .theme-lit .badge-icon { background: rgba(236, 72, 153, 0.15); color: var(--c-lit); }
    .theme-lit .mini-fill { background: var(--c-lit); }

    /* Экран списка задач */
    #todo-view {
      display: none;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 30;
      padding-bottom: 40px;
    }

    .detail-nav {
      position: sticky;
      top: 0;
      background: rgba(12, 13, 17, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .back-btn {
      background: #1c2029;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .detail-nav-title {
      flex: 1;
    }

    .detail-nav-title h2 {
      font-size: 17px;
      font-weight: 700;
    }

    .detail-nav-title p {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .tasks-container {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-block {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-m);
      overflow: hidden;
    }

    .section-title {
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item:active {
      background: rgba(255, 255, 255, 0.03);
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
      transition: all 0.2s ease;
    }

    .todo-item.done .custom-checkbox {
      border-color: #10b981;
      background: #10b981;
    }

    .custom-checkbox svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: #0c0d11;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s ease;
    }

    .todo-item.done .custom-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .todo-label {
      font-size: 14.5px;
      line-height: 1.4;
      color: #e5e7eb;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .todo-item.done .todo-label {
      color: #4b5563;
      text-decoration: line-through;
    }
  </style>
</head>

    // Состояние прогресса
    let state = JSON.parse(localStorage.getItem('nmt_tracker_v1') || '{}');
    let activeSubjectKey = null;

    function saveState() {
      localStorage.setItem('nmt_tracker_v1', JSON.stringify(state));
      renderHub();
      if (activeSubjectKey) renderDetailHeader();
    }

    function getSubjectStats(key) {
      const sub = SUBJECTS[key];
      let total = 0;
      let done = 0;

      sub.sections.forEach(sec => {
        sec.items.forEach(task => {
          total++;
          const taskId = `${key}_${task}`;
          if (state[taskId]) done++;
        });
      });

      return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
    }

    function renderHub() {
      const grid = document.getElementById('hub-grid');
      grid.innerHTML = '';

      let grandTotal = 0;
      let grandDone = 0;

      for (const [key, data] of Object.entries(SUBJECTS)) {
        const stats = getSubjectStats(key);
        grandTotal += stats.total;
        grandDone += stats.done;

        const card = document.createElement('div');
        card.className = `subject-btn ${data.class}`;
        card.onclick = () => openSubject(key);

        card.innerHTML = `
          <div class="btn-top">
            <div class="badge-icon">${data.code}</div>
            <div class="percent-val">${stats.pct}%</div>
          </div>
          <div class="btn-bottom">
            <div class="subject-title">${data.title}</div>
            <div class="subject-fraction">${stats.done}/${stats.total} тем</div>
            <div class="mini-track">
              <div class="mini-fill" style="width: ${stats.pct}%"></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }

      // Обновление общего хедера
      const totalPct = grandTotal ? Math.round((grandDone / grandTotal) * 100) : 0;
      document.getElementById('total-stats').innerHTML = `<span>${totalPct}%</span> (${grandDone}/${grandTotal})`;
      document.getElementById('total-bar').style.width = `${totalPct}%`;
    }

    function renderDetailHeader() {
      const sub = SUBJECTS[activeSubjectKey];
      const stats = getSubjectStats(activeSubjectKey);
      document.getElementById('view-title').textContent = sub.title;
      document.getElementById('view-progress').textContent = `${stats.done} з ${stats.total} вивчено (${stats.pct}%)`;
    }

    function openSubject(key) {
      activeSubjectKey = key;
      const sub = SUBJECTS[key];
      
      renderDetailHeader();
      const container = document.getElementById('tasks-scroll');
      container.innerHTML = '';

      sub.sections.forEach(sec => {
        const block = document.createElement('div');
        block.className = 'section-block';

        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = sec.name;
        block.appendChild(title);

        sec.items.forEach(task => {
          const taskId = `${key}_${task}`;
          const isDone = !!state[taskId];

          const row = document.createElement('div');
          row.className = `todo-item ${isDone ? 'done' : ''}`;
          
          row.innerHTML = `
            <div class="custom-checkbox">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="todo-label">${task}</div>
          `;

          row.onclick = () => {
            state[taskId] = !state[taskId];
            if (!state[taskId]) delete state[taskId];
            row.classList.toggle('done');
            saveState();
          };

          block.appendChild(row);
        });

        container.appendChild(block);
      });

      document.getElementById('todo-view').style.display = 'flex';
      window.scrollTo(0, 0);
    }

    document.getElementById('btn-back').onclick = () => {
      document.getElementById('todo-view').style.display = 'none';
      activeSubjectKey = null;
      renderHub();
    };

    // Первичный запуск
    renderHub();
  </script>
</body>
</html>
